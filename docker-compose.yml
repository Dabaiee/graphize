services:
  neo4j:
    image: neo4j:5.24-community
    container_name: fastgraph-neo4j
    ports:
      - "7580:7474"   # Neo4j Browser
      - "7690:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-fastgraph}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: fastgraph-backend
    ports:
      - "8180:8000"
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      FASTGRAPH_MODEL: "${FASTGRAPH_MODEL:-claude-opus-4-8}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-fastgraph}"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - upload_data:/data/uploads

  frontend:
    build: ./frontend
    container_name: fastgraph-frontend
    ports:
      - "5280:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  upload_data:
